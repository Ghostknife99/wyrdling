name: Capture live gameplay

on:
  pull_request:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Prepare capture path
        run: |
          sudo mkdir -p /workspace
          sudo ln -s "$GITHUB_WORKSPACE" /workspace/wyrdling
      - name: Capture actual game frames
        run: xvfb-run -a godot --path . -s res://src/smoke/capture_gameplay.gd
      - name: Upload live screenshots
        uses: actions/upload-artifact@v4
        with:
          name: live-gameplay-screenshots
          path: shots/*.png
